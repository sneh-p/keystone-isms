# Custom rules for the secure coding standard (.knowledge/secure-coding/). Each rule has test cases in
# .semgrep/tests/ (run: semgrep --test --config .semgrep/rules .semgrep/tests).
# Protected file (SC-AGT-002): changes need AppSec review.
rules:
  - id: sc-inj-001-sql-string-building
    languages: [python]
    severity: ERROR
    message: "SC-INJ-001: SQL built from strings. Use the ORM, or text() with bound :parameters."
    pattern-either:
      - pattern: $SQLA.text(f"...")
      - pattern: text(f"...")
      - pattern: text("..." + $X)
      - pattern: text($X + "...")
      - pattern: text("...".format(...))
      - pattern: text("..." % $X)
      - pattern: $S.execute(f"...", ...)
      - pattern: $S.execute("..." + $X, ...)
      - pattern: $S.execute("...".format(...), ...)
      - pattern: $S.execute("..." % $X, ...)
      - pattern: $S.exec_driver_sql(f"...", ...)

  - id: sc-cry-004-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: "SC-CRY-004: TLS certificate verification disabled."
    pattern-either:
      - pattern: $F(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: $CTX.verify_mode = ssl.CERT_NONE
      - pattern: $CTX.check_hostname = False
      - pattern: os.environ["PYTHONHTTPSVERIFY"] = "0"

  - id: sc-cry-004-tls-verification-disabled-js
    languages: [typescript, javascript]
    severity: ERROR
    message: "SC-CRY-004: TLS certificate verification disabled."
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: sc-xss-005-open-redirect
    languages: [python]
    severity: ERROR
    message: "SC-XSS-005: redirect target comes from the request. Redirect to a fixed path, or validate it as a same-origin path."
    pattern-either:
      - pattern: RedirectResponse($REQ.query_params.get(...), ...)
      - pattern: RedirectResponse($REQ.query_params[...], ...)
      - pattern: RedirectResponse(url=$REQ.query_params.get(...), ...)
      - pattern: RedirectResponse(url=$REQ.query_params[...], ...)
      - pattern: RedirectResponse($REQ.headers.get("referer"), ...)

  - id: sc-xss-005-open-redirect-js
    languages: [typescript, javascript]
    severity: ERROR
    message: "SC-XSS-005: navigation target comes from the URL or router state. Pass it through safeRedirectPath()."
    patterns:
      - pattern-either:
          - pattern: window.location.href = $P.get(...)
          - pattern: window.location.assign($P.get(...))
          - pattern: window.location.replace($P.get(...))
          - pattern: $NAV(($LOC.state as any)?.from)
          - pattern: $NAV(($LOC.state as any)?.from ?? $D)
      - pattern-not: safeRedirectPath(...)

  - id: sc-authn-004-jwt-decode-unverified
    languages: [python]
    severity: ERROR
    message: "SC-AUTHN-004: token decoded without verifying its signature. Verify with pinned algorithms, issuer and audience."
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: jwt.decode(..., verify=False, ...)
      - pattern: jwt.get_unverified_claims(...)

  - id: sc-val-004-regex-from-input
    languages: [python]
    severity: ERROR
    message: "SC-VAL-004: regular expression built from a variable. Use a literal pattern, or re.escape() the value."
    patterns:
      - pattern-either:
          - pattern: re.compile($P, ...)
          - pattern: re.match($P, $S, ...)
          - pattern: re.search($P, $S, ...)
          - pattern: re.fullmatch($P, $S, ...)
          - pattern: re.sub($P, $R, $S, ...)
      - pattern-not: re.$F("...", ...)
      - pattern-not: re.$F(re.escape(...), ...)
      - pattern-not: re.$F(f"...{re.escape(...)}...", ...)

  - id: sc-file-001-path-from-input
    languages: [python]
    severity: ERROR
    message: "SC-FILE-001: file path built from an uploaded filename. Store under a generated name (save_attachment)."
    pattern-either:
      - pattern: open($F.filename, ...)
      - pattern: $DIR / $F.filename
      - pattern: os.path.join(..., $F.filename, ...)
      - pattern: Path($F.filename)
