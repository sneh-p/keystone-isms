# nginx config used by docker-compose.yml (evaluation: plain HTTP on a private network). For real use, terminate
# TLS: adapt deploy/nginx/keystone.conf (HTTPS) with upstream keystone:8000 and mount your certificate.

upstream keystone_app {
    server keystone:8000;
    keepalive 16;
}

# Login: slow down password guessing (Trust Center requests are rate limited in the app).
limit_req_zone $binary_remote_addr zone=keystone_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 30m;          # KEYSTONE_MAX_UPLOAD_MB (25) plus form overhead

    location = /api/auth/login {
        limit_req zone=keystone_auth burst=10 nodelay;
        proxy_pass http://keystone_app;
        include /etc/nginx/snippets/keystone-proxy.conf;
    }

    location / {
        proxy_pass http://keystone_app;
        include /etc/nginx/snippets/keystone-proxy.conf;
        # AI drafting and integration runs can take a few minutes.
        proxy_read_timeout 300s;
    }
}
