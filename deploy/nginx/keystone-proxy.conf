# Shared proxy settings for the configs in deploy/nginx/. Install as /etc/nginx/snippets/keystone-proxy.conf.
# The client's Host header is not forwarded: Keystone builds no URLs from it (links use KEYSTONE_PUBLIC_URL).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
