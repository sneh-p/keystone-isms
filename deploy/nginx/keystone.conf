# Production nginx config for Keystone ISMS: HTTPS only (SC-CFG-006). uvicorn listens on 127.0.0.1:8000.
# Replace isms.example.com with your host name (three places), get a certificate (for example
#   sudo certbot certonly --webroot -w /var/www/html -d isms.example.com), and set
#   KEYSTONE_PUBLIC_URL=https://isms.example.com for the Keystone service.
# For evaluation on a private network only, keystone-http.conf serves plain HTTP instead.

upstream keystone_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Login: slow down password guessing (Trust Center requests are rate limited in the app).
limit_req_zone $binary_remote_addr zone=keystone_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name isms.example.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://isms.example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name isms.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/isms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:keystone_tls:10m;
    ssl_session_tickets off;

    client_max_body_size 30m;          # KEYSTONE_MAX_UPLOAD_MB (25) plus form overhead

    location = /api/auth/login {
        limit_req zone=keystone_auth burst=10 nodelay;
        proxy_pass http://keystone_app;
        include /etc/nginx/snippets/keystone-proxy.conf;
    }

    location / {
        proxy_pass http://keystone_app;
        include /etc/nginx/snippets/keystone-proxy.conf;
        proxy_read_timeout 300s;       # AI drafting and integration runs can take a few minutes
    }
}
