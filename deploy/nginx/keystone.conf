# nginx reverse proxy for Keystone ISMS (Streamlit on 127.0.0.1:8501).
# Plain HTTP on port 80 for a first deployment. For production, add a TLS server block
# (e.g. certbot) and redirect port 80 to 443; see docs/admin-guide.md.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream keystone_app {
    server 127.0.0.1:8501;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 50m;          # matches server.maxUploadSize in .streamlit/config.toml

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Clickjacking protection is not set here because some preview tools embed the app in a
    # frame. Once Keystone is only used on its own domain, add:
    #   add_header Content-Security-Policy "frame-ancestors 'self'" always;

    location / {
        proxy_pass http://keystone_app;
        proxy_http_version 1.1;

        # Keep the original Host (with port): Streamlit compares it with the browser's Origin
        # to accept the WebSocket connection.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Streamlit sends every interaction over /_stcore/stream).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
