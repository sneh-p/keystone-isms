[project]
name = "vendor-exposure-map"
version = "0.1.0"
description = "Read-only inventory of third-party Entra ID apps across MSP client tenants, feeding VendorFAIR FAIR assessments."
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40",
  "sqlalchemy>=2.0",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "rapidfuzz>=3.6",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
