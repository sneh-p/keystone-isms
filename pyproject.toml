[project]
name = "keystone-isms"
version = "0.1.0"
description = "Keystone ISMS: multi-framework information security management system (risk, controls, SoA, third-party risk, policies, incidents, audits)."
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "numpy>=1.26",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "rapidfuzz>=3.6",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10,<4",
  "cryptography>=42",
  "anthropic>=0.40",
  "boto3>=1.34",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["keystone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# SQLAlchemy warnings (e.g. objects not added to the session) are bugs: fail on them.
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
