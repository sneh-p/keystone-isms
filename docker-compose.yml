# Keystone ISMS with nginx in front. Usage:
#   docker compose up -d --build        then open http://localhost/
# Data (database, attachments, encryption key) lives in the keystone-data volume: back it up.
services:
  keystone:
    build: .
    restart: unless-stopped
    environment:
      KEYSTONE_DATA_DIR: /data
      FORWARDED_ALLOW_IPS: "*"           # only nginx can reach this container
      # KEYSTONE_SECRET_KEY: ...         # optional: Fernet key for integration/AI secrets (else generated in /data)
      # ANTHROPIC_API_KEY: ...           # optional: AI features (or set the key under Settings → AI)
    volumes:
      - keystone-data:/data
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [keystone]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/compose.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/keystone-proxy.conf:/etc/nginx/snippets/keystone-proxy.conf:ro

volumes:
  keystone-data:
