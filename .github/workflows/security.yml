# Security gates of the secure coding standard (.knowledge/secure-coding/verification.md).
# Make "security-check" a required status check and require Code Owner review on main.
# Protected file (SC-AGT-002): changes need AppSec review.
name: security
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SEMGREP_VERSION: "1.185.0"
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      PSSA_VERSION: "1.25.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies (hash-locked)
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.lock
          .venv/bin/pip install --no-deps -e .
          .venv/bin/pip install "pytest==9.2.0" "ruff==0.17.5" "pip-audit==2.10.1"
      - name: Install web dependencies
        working-directory: web
        run: |
          npm install -g npm@11.21.2   # verifies current registry keys; enforces min-release-age in web/.npmrc
          npm ci                       # web/.npmrc sets ignore-scripts=true
      - name: Install scanners
        run: |
          python -m venv .tools/semgrep
          .tools/semgrep/bin/pip install "semgrep==${SEMGREP_VERSION}"
          curl -sSfLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz
          pwsh -NoProfile -Command "Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION -Scope CurrentUser -Force"

      - name: Security gates
        run: scripts/security-check.sh all
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
          ALLOW_PROTECTED: "1"   # in CI, CODEOWNERS review gates protected files
