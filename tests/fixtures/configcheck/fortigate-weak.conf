#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
#conf_file_ver=0000000000000000
#buildno=1517
#global_vdom=1
config system global
    set admin-https-redirect disable
    set admintimeout 480
    set hostname "FGT-FICTIONAL-HQ"
    set strong-crypto disable
end
config system interface
    edit "wan1"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh http telnet
    next
    edit "internal"
        set ip 198.51.100.1 255.255.255.0
        set allowaccess ping https ssh
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SH2FAKEFORTIGATEHASHnotreal0000000000000000000000000000000000
    next
end
config system ntp
    set ntpsync disable
end
config log syslogd setting
    set status disable
end
config system snmp community
    edit 1
        set name "public"
    next
end
config vpn certificate local
    edit "fictional-cert"
        set private-key "-----BEGIN ENCRYPTED PRIVATE KEY-----
FAKEPRIVATEKEYMATERIALnotreal
-----END ENCRYPTED PRIVATE KEY-----"
    next
end
config firewall policy
    edit 1
        set name "allow-everything"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
    edit 2
        set name "web"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "office-lan"
        set dstaddr "all"
        set service "HTTPS"
    next
    edit 3
        set name "disabled-any"
        set status disable
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
    next
end
