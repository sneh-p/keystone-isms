#config-version=FGT100F-7.4.3-FW-build2573-240201:opmode=0:vdom=0:user=admin
config system global
    set admin-https-redirect enable
    set admintimeout 10
    set hostname "FGT-FICTIONAL-DC"
    set strong-crypto enable
end
config system interface
    edit "mgmt"
        set ip 203.0.113.10 255.255.255.0
        set allowaccess ping https ssh
    next
end
config system admin
    edit "secadmin"
        set trusthost1 203.0.113.0 255.255.255.0
        set two-factor fortitoken
        set password ENC SH2FAKEFORTIGATEHASHnotreal1111111111111111111111111111111111
    next
end
config system ntp
    set ntpsync enable
    set type fortiguard
end
config log syslogd setting
    set status enable
    set server "203.0.113.50"
end
config firewall policy
    edit 1
        set name "web"
        set action accept
        set srcaddr "office-lan"
        set dstaddr "all"
        set service "HTTPS"
    next
end
