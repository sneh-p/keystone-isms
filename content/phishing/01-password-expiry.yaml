key: password-expiry
title: Password expires today
difficulty: easy
from_name: IT Service Desk
subject: "Action needed: your password expires today"
body: |
  Hello,

  Your account password expires at 17:00 today. To keep access to email and files, confirm your current password now:

  {link}

  If you do not act, your account will be locked and you will need to contact the service desk.

  IT Service Desk
red_flags:
  - Urgency and a threat ("expires today", "will be locked").
  - IT never asks you to confirm your password through a link.
  - The link goes to an address that isn't your company's sign-in page.
