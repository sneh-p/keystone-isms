key: passwords-mfa
title: Passwords and multi-factor authentication
version: 1
minutes: 5
summary: How to create, store and protect credentials, and why MFA matters.
body: |
  ## Passwords
  - Use the company password manager to generate and store a unique password for every account.
  - For passwords you must remember, use a passphrase of four or more random words.
  - Never share passwords, not even with IT. Nobody legitimate will ask for them.

  ## Multi-factor authentication (MFA)
  MFA stops most account takeovers even when a password is stolen. Use the strongest method offered: a security key or passkey is best, then an authenticator app with number matching. Avoid SMS where you can.

  ## If something goes wrong
  If you think a password or device is compromised, report it straight away so access can be reset.
quiz:
  - q: What is the best way to manage many passwords?
    options: ["Reuse one strong password", "Use the company password manager", "Write them in a notebook on your desk"]
    answer: 1
  - q: IT support calls and asks for your password to fix an issue. What do you do?
    options: ["Give it to them", "Refuse and report the call", "Give them an old password"]
    answer: 1
  - q: Which MFA method is strongest?
    options: ["SMS code", "Security key or passkey", "Security questions"]
    answer: 1
pass_mark: 2
