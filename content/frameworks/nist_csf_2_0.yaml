# NIST Cybersecurity Framework (CSF) 2.0, NIST CSWP 29 (February 2024).
# Work of the US Government, not subject to copyright in the United States.
# Transcribed for Keystone; verify against the official publication.
framework:
  code: NIST_CSF_2_0
  name: NIST Cybersecurity Framework
  version: "2.0"
  publisher: National Institute of Standards and Technology
  license: public_domain
  text_level: full
  source_url: https://doi.org/10.6028/NIST.CSWP.29
  notice: "Public domain (US Government work). Transcribed from NIST CSWP 29; verify against the official publication."

requirements:
  # ------------------------------------------------------------------ GOVERN
  - {ref: GV, kind: function, title: "Govern (GV)", description: "The organization's cybersecurity risk management strategy, expectations, and policy are established, communicated, and monitored"}
  - {ref: GV.OC, parent: GV, kind: category, title: "Organizational Context", description: "The circumstances — mission, stakeholder expectations, dependencies, and legal, regulatory, and contractual requirements — surrounding the organization's cybersecurity risk management decisions are understood"}
  - {ref: GV.OC-01, parent: GV.OC, kind: subcategory, title: "The organizational mission is understood and informs cybersecurity risk management"}
  - {ref: GV.OC-02, parent: GV.OC, kind: subcategory, title: "Internal and external stakeholders are understood, and their needs and expectations regarding cybersecurity risk management are understood and considered"}
  - {ref: GV.OC-03, parent: GV.OC, kind: subcategory, title: "Legal, regulatory, and contractual requirements regarding cybersecurity — including privacy and civil liberties obligations — are understood and managed"}
  - {ref: GV.OC-04, parent: GV.OC, kind: subcategory, title: "Critical objectives, capabilities, and services that external stakeholders depend on or expect from the organization are understood and communicated"}
  - {ref: GV.OC-05, parent: GV.OC, kind: subcategory, title: "Outcomes, capabilities, and services that the organization depends on are understood and communicated"}
  - {ref: GV.RM, parent: GV, kind: category, title: "Risk Management Strategy", description: "The organization's priorities, constraints, risk tolerance and appetite statements, and assumptions are established, communicated, and used to support operational risk decisions"}
  - {ref: GV.RM-01, parent: GV.RM, kind: subcategory, title: "Risk management objectives are established and agreed to by organizational stakeholders"}
  - {ref: GV.RM-02, parent: GV.RM, kind: subcategory, title: "Risk appetite and risk tolerance statements are established, communicated, and maintained"}
  - {ref: GV.RM-03, parent: GV.RM, kind: subcategory, title: "Cybersecurity risk management activities and outcomes are included in enterprise risk management processes"}
  - {ref: GV.RM-04, parent: GV.RM, kind: subcategory, title: "Strategic direction that describes appropriate risk response options is established and communicated"}
  - {ref: GV.RM-05, parent: GV.RM, kind: subcategory, title: "Lines of communication across the organization are established for cybersecurity risks, including risks from suppliers and other third parties"}
  - {ref: GV.RM-06, parent: GV.RM, kind: subcategory, title: "A standardized method for calculating, documenting, categorizing, and prioritizing cybersecurity risks is established and communicated"}
  - {ref: GV.RM-07, parent: GV.RM, kind: subcategory, title: "Strategic opportunities (i.e., positive risks) are characterized and are included in organizational cybersecurity risk discussions"}
  - {ref: GV.RR, parent: GV, kind: category, title: "Roles, Responsibilities, and Authorities", description: "Cybersecurity roles, responsibilities, and authorities to foster accountability, performance assessment, and continuous improvement are established and communicated"}
  - {ref: GV.RR-01, parent: GV.RR, kind: subcategory, title: "Organizational leadership is responsible and accountable for cybersecurity risk and fosters a culture that is risk-aware, ethical, and continually improving"}
  - {ref: GV.RR-02, parent: GV.RR, kind: subcategory, title: "Roles, responsibilities, and authorities related to cybersecurity risk management are established, communicated, understood, and enforced"}
  - {ref: GV.RR-03, parent: GV.RR, kind: subcategory, title: "Adequate resources are allocated commensurate with the cybersecurity risk strategy, roles, responsibilities, and policies"}
  - {ref: GV.RR-04, parent: GV.RR, kind: subcategory, title: "Cybersecurity is included in human resources practices"}
  - {ref: GV.PO, parent: GV, kind: category, title: "Policy", description: "Organizational cybersecurity policy is established, communicated, and enforced"}
  - {ref: GV.PO-01, parent: GV.PO, kind: subcategory, title: "Policy for managing cybersecurity risks is established based on organizational context, cybersecurity strategy, and priorities and is communicated and enforced"}
  - {ref: GV.PO-02, parent: GV.PO, kind: subcategory, title: "Policy for managing cybersecurity risks is reviewed, updated, communicated, and enforced to reflect changes in requirements, threats, technology, and organizational mission"}
  - {ref: GV.OV, parent: GV, kind: category, title: "Oversight", description: "Results of organization-wide cybersecurity risk management activities and performance are used to inform, improve, and adjust the risk management strategy"}
  - {ref: GV.OV-01, parent: GV.OV, kind: subcategory, title: "Cybersecurity risk management strategy outcomes are reviewed to inform and adjust strategy and direction"}
  - {ref: GV.OV-02, parent: GV.OV, kind: subcategory, title: "The cybersecurity risk management strategy is reviewed and adjusted to ensure coverage of organizational requirements and risks"}
  - {ref: GV.OV-03, parent: GV.OV, kind: subcategory, title: "Organizational cybersecurity risk management performance is evaluated and reviewed for adjustments needed"}
  - {ref: GV.SC, parent: GV, kind: category, title: "Cybersecurity Supply Chain Risk Management", description: "Cyber supply chain risk management processes are identified, established, managed, monitored, and improved by organizational stakeholders"}
  - {ref: GV.SC-01, parent: GV.SC, kind: subcategory, title: "A cybersecurity supply chain risk management program, strategy, objectives, policies, and processes are established and agreed to by organizational stakeholders"}
  - {ref: GV.SC-02, parent: GV.SC, kind: subcategory, title: "Cybersecurity roles and responsibilities for suppliers, customers, and partners are established, communicated, and coordinated internally and externally"}
  - {ref: GV.SC-03, parent: GV.SC, kind: subcategory, title: "Cybersecurity supply chain risk management is integrated into cybersecurity and enterprise risk management, risk assessment, and improvement processes"}
  - {ref: GV.SC-04, parent: GV.SC, kind: subcategory, title: "Suppliers are known and prioritized by criticality"}
  - {ref: GV.SC-05, parent: GV.SC, kind: subcategory, title: "Requirements to address cybersecurity risks in supply chains are established, prioritized, and integrated into contracts and other types of agreements with suppliers and other relevant third parties"}
  - {ref: GV.SC-06, parent: GV.SC, kind: subcategory, title: "Planning and due diligence are performed to reduce risks before entering into formal supplier or other third-party relationships"}
  - {ref: GV.SC-07, parent: GV.SC, kind: subcategory, title: "The risks posed by a supplier, their products and services, and other third parties are understood, recorded, prioritized, assessed, responded to, and monitored over the course of the relationship"}
  - {ref: GV.SC-08, parent: GV.SC, kind: subcategory, title: "Relevant suppliers and other third parties are included in incident planning, response, and recovery activities"}
  - {ref: GV.SC-09, parent: GV.SC, kind: subcategory, title: "Supply chain security practices are integrated into cybersecurity and enterprise risk management programs, and their performance is monitored throughout the technology product and service life cycle"}
  - {ref: GV.SC-10, parent: GV.SC, kind: subcategory, title: "Cybersecurity supply chain risk management plans include provisions for activities that occur after the conclusion of a partnership or service agreement"}
  # ------------------------------------------------------------------ IDENTIFY
  - {ref: ID, kind: function, title: "Identify (ID)", description: "The organization's current cybersecurity risks are understood"}
  - {ref: ID.AM, parent: ID, kind: category, title: "Asset Management", description: "Assets (e.g., data, hardware, software, systems, facilities, services, people) that enable the organization to achieve business purposes are identified and managed consistent with their relative importance to organizational objectives and the organization's risk strategy"}
  - {ref: ID.AM-01, parent: ID.AM, kind: subcategory, title: "Inventories of hardware managed by the organization are maintained"}
  - {ref: ID.AM-02, parent: ID.AM, kind: subcategory, title: "Inventories of software, services, and systems managed by the organization are maintained"}
  - {ref: ID.AM-03, parent: ID.AM, kind: subcategory, title: "Representations of the organization's authorized network communication and internal and external network data flows are maintained"}
  - {ref: ID.AM-04, parent: ID.AM, kind: subcategory, title: "Inventories of services provided by suppliers are maintained"}
  - {ref: ID.AM-05, parent: ID.AM, kind: subcategory, title: "Assets are prioritized based on classification, criticality, resources, and impact on the mission"}
  - {ref: ID.AM-07, parent: ID.AM, kind: subcategory, title: "Inventories of data and corresponding metadata for designated data types are maintained"}
  - {ref: ID.AM-08, parent: ID.AM, kind: subcategory, title: "Systems, hardware, software, services, and data are managed throughout their life cycles"}
  - {ref: ID.RA, parent: ID, kind: category, title: "Risk Assessment", description: "The cybersecurity risk to the organization, assets, and individuals is understood by the organization"}
  - {ref: ID.RA-01, parent: ID.RA, kind: subcategory, title: "Vulnerabilities in assets are identified, validated, and recorded"}
  - {ref: ID.RA-02, parent: ID.RA, kind: subcategory, title: "Cyber threat intelligence is received from information sharing forums and sources"}
  - {ref: ID.RA-03, parent: ID.RA, kind: subcategory, title: "Internal and external threats to the organization are identified and recorded"}
  - {ref: ID.RA-04, parent: ID.RA, kind: subcategory, title: "Potential impacts and likelihoods of threats exploiting vulnerabilities are identified and recorded"}
  - {ref: ID.RA-05, parent: ID.RA, kind: subcategory, title: "Threats, vulnerabilities, likelihoods, and impacts are used to understand inherent risk and inform risk response prioritization"}
  - {ref: ID.RA-06, parent: ID.RA, kind: subcategory, title: "Risk responses are chosen, prioritized, planned, tracked, and communicated"}
  - {ref: ID.RA-07, parent: ID.RA, kind: subcategory, title: "Changes and exceptions are managed, assessed for risk impact, recorded, and tracked"}
  - {ref: ID.RA-08, parent: ID.RA, kind: subcategory, title: "Processes for receiving, analyzing, and responding to vulnerability disclosures are established"}
  - {ref: ID.RA-09, parent: ID.RA, kind: subcategory, title: "The authenticity and integrity of hardware and software are assessed prior to acquisition and use"}
  - {ref: ID.RA-10, parent: ID.RA, kind: subcategory, title: "Critical suppliers are assessed prior to acquisition"}
  - {ref: ID.IM, parent: ID, kind: category, title: "Improvement", description: "Improvements to organizational cybersecurity risk management processes, procedures and activities are identified across all CSF Functions"}
  - {ref: ID.IM-01, parent: ID.IM, kind: subcategory, title: "Improvements are identified from evaluations"}
  - {ref: ID.IM-02, parent: ID.IM, kind: subcategory, title: "Improvements are identified from security tests and exercises, including those done in coordination with suppliers and relevant third parties"}
  - {ref: ID.IM-03, parent: ID.IM, kind: subcategory, title: "Improvements are identified from execution of operational processes, procedures, and activities"}
  - {ref: ID.IM-04, parent: ID.IM, kind: subcategory, title: "Incident response plans and other cybersecurity plans that affect operations are established, communicated, maintained, and improved"}
  # ------------------------------------------------------------------ PROTECT
  - {ref: PR, kind: function, title: "Protect (PR)", description: "Safeguards to manage the organization's cybersecurity risks are used"}
  - {ref: PR.AA, parent: PR, kind: category, title: "Identity Management, Authentication, and Access Control", description: "Access to physical and logical assets is limited to authorized users, services, and hardware and managed commensurate with the assessed risk of unauthorized access"}
  - {ref: PR.AA-01, parent: PR.AA, kind: subcategory, title: "Identities and credentials for authorized users, services, and hardware are managed by the organization"}
  - {ref: PR.AA-02, parent: PR.AA, kind: subcategory, title: "Identities are proofed and bound to credentials based on the context of interactions"}
  - {ref: PR.AA-03, parent: PR.AA, kind: subcategory, title: "Users, services, and hardware are authenticated"}
  - {ref: PR.AA-04, parent: PR.AA, kind: subcategory, title: "Identity assertions are protected, conveyed, and verified"}
  - {ref: PR.AA-05, parent: PR.AA, kind: subcategory, title: "Access permissions, entitlements, and authorizations are defined in a policy, managed, enforced, and reviewed, and incorporate the principles of least privilege and separation of duties"}
  - {ref: PR.AA-06, parent: PR.AA, kind: subcategory, title: "Physical access to assets is managed, monitored, and enforced commensurate with risk"}
  - {ref: PR.AT, parent: PR, kind: category, title: "Awareness and Training", description: "The organization's personnel are provided with cybersecurity awareness and training so that they can perform their cybersecurity-related tasks"}
  - {ref: PR.AT-01, parent: PR.AT, kind: subcategory, title: "Personnel are provided with awareness and training so that they possess the knowledge and skills to perform general tasks with cybersecurity risks in mind"}
  - {ref: PR.AT-02, parent: PR.AT, kind: subcategory, title: "Individuals in specialized roles are provided with awareness and training so that they possess the knowledge and skills to perform relevant tasks with cybersecurity risks in mind"}
  - {ref: PR.DS, parent: PR, kind: category, title: "Data Security", description: "Data are managed consistent with the organization's risk strategy to protect the confidentiality, integrity, and availability of information"}
  - {ref: PR.DS-01, parent: PR.DS, kind: subcategory, title: "The confidentiality, integrity, and availability of data-at-rest are protected"}
  - {ref: PR.DS-02, parent: PR.DS, kind: subcategory, title: "The confidentiality, integrity, and availability of data-in-transit are protected"}
  - {ref: PR.DS-10, parent: PR.DS, kind: subcategory, title: "The confidentiality, integrity, and availability of data-in-use are protected"}
  - {ref: PR.DS-11, parent: PR.DS, kind: subcategory, title: "Backups of data are created, protected, maintained, and tested"}
  - {ref: PR.PS, parent: PR, kind: category, title: "Platform Security", description: "The hardware, software (e.g., firmware, operating systems, applications), and services of physical and virtual platforms are managed consistent with the organization's risk strategy to protect their confidentiality, integrity, and availability"}
  - {ref: PR.PS-01, parent: PR.PS, kind: subcategory, title: "Configuration management practices are established and applied"}
  - {ref: PR.PS-02, parent: PR.PS, kind: subcategory, title: "Software is maintained, replaced, and removed commensurate with risk"}
  - {ref: PR.PS-03, parent: PR.PS, kind: subcategory, title: "Hardware is maintained, replaced, and removed commensurate with risk"}
  - {ref: PR.PS-04, parent: PR.PS, kind: subcategory, title: "Log records are generated and made available for continuous monitoring"}
  - {ref: PR.PS-05, parent: PR.PS, kind: subcategory, title: "Installation and execution of unauthorized software are prevented"}
  - {ref: PR.PS-06, parent: PR.PS, kind: subcategory, title: "Secure software development practices are integrated, and their performance is monitored throughout the software development life cycle"}
  - {ref: PR.IR, parent: PR, kind: category, title: "Technology Infrastructure Resilience", description: "Security architectures are managed with the organization's risk strategy to protect asset confidentiality, integrity, and availability, and organizational resilience"}
  - {ref: PR.IR-01, parent: PR.IR, kind: subcategory, title: "Networks and environments are protected from unauthorized logical access and usage"}
  - {ref: PR.IR-02, parent: PR.IR, kind: subcategory, title: "The organization's technology assets are protected from environmental threats"}
  - {ref: PR.IR-03, parent: PR.IR, kind: subcategory, title: "Mechanisms are implemented to achieve resilience requirements in normal and adverse situations"}
  - {ref: PR.IR-04, parent: PR.IR, kind: subcategory, title: "Adequate resource capacity to ensure availability is maintained"}
  # ------------------------------------------------------------------ DETECT
  - {ref: DE, kind: function, title: "Detect (DE)", description: "Possible cybersecurity attacks and compromises are found and analyzed"}
  - {ref: DE.CM, parent: DE, kind: category, title: "Continuous Monitoring", description: "Assets are monitored to find anomalies, indicators of compromise, and other potentially adverse events"}
  - {ref: DE.CM-01, parent: DE.CM, kind: subcategory, title: "Networks and network services are monitored to find potentially adverse events"}
  - {ref: DE.CM-02, parent: DE.CM, kind: subcategory, title: "The physical environment is monitored to find potentially adverse events"}
  - {ref: DE.CM-03, parent: DE.CM, kind: subcategory, title: "Personnel activity and technology usage are monitored to find potentially adverse events"}
  - {ref: DE.CM-06, parent: DE.CM, kind: subcategory, title: "External service provider activities and services are monitored to find potentially adverse events"}
  - {ref: DE.CM-09, parent: DE.CM, kind: subcategory, title: "Computing hardware and software, runtime environments, and their data are monitored to find potentially adverse events"}
  - {ref: DE.AE, parent: DE, kind: category, title: "Adverse Event Analysis", description: "Anomalies, indicators of compromise, and other potentially adverse events are analyzed to characterize the events and detect cybersecurity incidents"}
  - {ref: DE.AE-02, parent: DE.AE, kind: subcategory, title: "Potentially adverse events are analyzed to better understand associated activities"}
  - {ref: DE.AE-03, parent: DE.AE, kind: subcategory, title: "Information is correlated from multiple sources"}
  - {ref: DE.AE-04, parent: DE.AE, kind: subcategory, title: "The estimated impact and scope of adverse events are understood"}
  - {ref: DE.AE-06, parent: DE.AE, kind: subcategory, title: "Information on adverse events is provided to authorized staff and tools"}
  - {ref: DE.AE-07, parent: DE.AE, kind: subcategory, title: "Cyber threat intelligence and other contextual information are integrated into the analysis"}
  - {ref: DE.AE-08, parent: DE.AE, kind: subcategory, title: "Incidents are declared when adverse events meet the defined incident criteria"}
  # ------------------------------------------------------------------ RESPOND
  - {ref: RS, kind: function, title: "Respond (RS)", description: "Actions regarding a detected cybersecurity incident are taken"}
  - {ref: RS.MA, parent: RS, kind: category, title: "Incident Management", description: "Responses to detected cybersecurity incidents are managed"}
  - {ref: RS.MA-01, parent: RS.MA, kind: subcategory, title: "The incident response plan is executed in coordination with relevant third parties once an incident is declared"}
  - {ref: RS.MA-02, parent: RS.MA, kind: subcategory, title: "Incident reports are triaged and validated"}
  - {ref: RS.MA-03, parent: RS.MA, kind: subcategory, title: "Incidents are categorized and prioritized"}
  - {ref: RS.MA-04, parent: RS.MA, kind: subcategory, title: "Incidents are escalated or elevated as needed"}
  - {ref: RS.MA-05, parent: RS.MA, kind: subcategory, title: "The criteria for initiating incident recovery are applied"}
  - {ref: RS.AN, parent: RS, kind: category, title: "Incident Analysis", description: "Investigations are conducted to ensure effective response and support forensics and recovery activities"}
  - {ref: RS.AN-03, parent: RS.AN, kind: subcategory, title: "Analysis is performed to establish what has taken place during an incident and the root cause of the incident"}
  - {ref: RS.AN-06, parent: RS.AN, kind: subcategory, title: "Actions performed during an investigation are recorded, and the records' integrity and provenance are preserved"}
  - {ref: RS.AN-07, parent: RS.AN, kind: subcategory, title: "Incident data and metadata are collected, and their integrity and provenance are preserved"}
  - {ref: RS.AN-08, parent: RS.AN, kind: subcategory, title: "An incident's magnitude is estimated and validated"}
  - {ref: RS.CO, parent: RS, kind: category, title: "Incident Response Reporting and Communication", description: "Response activities are coordinated with internal and external stakeholders as required by laws, regulations, or policies"}
  - {ref: RS.CO-02, parent: RS.CO, kind: subcategory, title: "Internal and external stakeholders are notified of incidents"}
  - {ref: RS.CO-03, parent: RS.CO, kind: subcategory, title: "Information is shared with designated internal and external stakeholders"}
  - {ref: RS.MI, parent: RS, kind: category, title: "Incident Mitigation", description: "Activities are performed to prevent expansion of an event and mitigate its effects"}
  - {ref: RS.MI-01, parent: RS.MI, kind: subcategory, title: "Incidents are contained"}
  - {ref: RS.MI-02, parent: RS.MI, kind: subcategory, title: "Incidents are eradicated"}
  # ------------------------------------------------------------------ RECOVER
  - {ref: RC, kind: function, title: "Recover (RC)", description: "Assets and operations affected by a cybersecurity incident are restored"}
  - {ref: RC.RP, parent: RC, kind: category, title: "Incident Recovery Plan Execution", description: "Restoration activities are performed to ensure operational availability of systems and services affected by cybersecurity incidents"}
  - {ref: RC.RP-01, parent: RC.RP, kind: subcategory, title: "The recovery portion of the incident response plan is executed once initiated from the incident response process"}
  - {ref: RC.RP-02, parent: RC.RP, kind: subcategory, title: "Recovery actions are selected, scoped, prioritized, and performed"}
  - {ref: RC.RP-03, parent: RC.RP, kind: subcategory, title: "The integrity of backups and other restoration assets is verified before using them for restoration"}
  - {ref: RC.RP-04, parent: RC.RP, kind: subcategory, title: "Critical mission functions and cybersecurity risk management are considered to establish post-incident operational norms"}
  - {ref: RC.RP-05, parent: RC.RP, kind: subcategory, title: "The integrity of restored assets is verified, systems and services are restored, and normal operating status is confirmed"}
  - {ref: RC.RP-06, parent: RC.RP, kind: subcategory, title: "The end of incident recovery is declared based on criteria, and incident-related documentation is completed"}
  - {ref: RC.CO, parent: RC, kind: category, title: "Incident Recovery Communication", description: "Restoration activities are coordinated with internal and external parties"}
  - {ref: RC.CO-03, parent: RC.CO, kind: subcategory, title: "Recovery activities and progress in restoring operational capabilities are communicated to designated internal and external stakeholders"}
  - {ref: RC.CO-04, parent: RC.CO, kind: subcategory, title: "Public updates on incident recovery are shared using approved methods and messaging"}
